---
- name: Gather network facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - network

- name: Initialize matching interface list
  ansible.builtin.set_fact:
    xspress3_matching_interfaces: []

- name: Find interface on the requested beamline network
  ansible.builtin.set_fact:
    xspress3_matching_interfaces: >-
      {{ xspress3_matching_interfaces + [item] }}
  loop: "{{ ansible_facts.interfaces }}"
  vars:
    iface: "{{ ansible_facts[item | replace('-', '_')] | default({}) }}"
    network_info: >-
      {{ nsls2network[ioc.network.beamline][ioc.network.name] }}
  when:
    - iface.ipv4 is defined
    - iface.ipv4.network == (network_info['subnet'] | string).split('/')[0]
    - iface.ipv4.netmask == (network_info['netmask'] | string)

- name: Require exactly one matching interface
  ansible.builtin.assert:
    that:
      - xspress3_matching_interfaces | length == 1
    fail_msg: >-
      Expected one matching interface;
      found {{ xspress3_matching_interfaces }}.

- name: Get active NetworkManager connection UUID
  become: true
  ansible.builtin.command:
    argv:
      - nmcli
      - -g
      - GENERAL.CON-UUID
      - device
      - show
      - "{{ xspress3_matching_interfaces[0] }}"
  register: xspress3_connection
  changed_when: false

- name: Require an active NetworkManager connection
  ansible.builtin.assert:
    that:
      - (xspress3_connection.stdout | trim) not in ['', '--']

- name: Read saved IPv4 addresses
  become: true
  ansible.builtin.command:
    argv:
      - nmcli
      - -g
      - ipv4.addresses
      - connection
      - show
      - uuid
      - "{{ xspress3_connection.stdout | trim }}"
  register: xspress3_saved_addresses
  changed_when: false

- name: Save additional VM address if missing
  become: true
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - uuid
      - "{{ xspress3_connection.stdout | trim }}"
      - +ipv4.addresses
      - "{{ ioc.network.address }}"
  when: >-
    ioc.network.address not in
    (xspress3_saved_addresses.stdout.split(',') | map('trim') | list)
  changed_when: true

- name: Apply saved network settings
  become: true
  ansible.builtin.command:
    argv:
      - nmcli
      - device
      - reapply
      - "{{ xspress3_matching_interfaces[0] }}"
  changed_when: false
