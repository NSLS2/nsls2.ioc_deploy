---
# Canonical CI lint gate, matching NSLS2/ansible. Runs the committed
# .pre-commit-config.yaml (the same hook set developers run locally)
# against changed files only.
#
# Changed-file scope:
#   pull_request      -> files changed vs. the PR base.
#   push to main      -> files changed in the push (github.event.before..HEAD).
#   workflow_dispatch -> all files (no push range available; safe fallback).
#
# The ansible-lint pre-commit hook is skipped in the lint job via
# SKIP=ansible-lint because that job installs no galaxy collections.
# The run_ansible_lint job installs them first and is the authoritative
# CI gate for collection-aware ansible-lint.

name: Lint
permissions:
  contents: read

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (changed files)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache pre-commit pixi environment
        uses: actions/cache@v6
        env:
          CACHE_FILE_HASH: ${{ hashFiles('pixi.lock', '.pre-commit-config.yaml') }}
        with:
          path: |
            /home/runner/.cache/pre-commit
            ${{ github.workspace }}/.pixi/envs/dev
          key: pre-commit-pixi-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_FILE_HASH }}

      - name: Setup Pixi
        # SHA pin for supply-chain safety; comment shows the human-readable tag.
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.2
        with:
          pixi-version: v0.83.0
          environments: dev
          cache: false
          frozen: true

      - name: Determine changed-file ref range
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "from_ref=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
            echo "to_ref=${SHA}"               >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            echo "from_ref=${BEFORE}"          >> "$GITHUB_OUTPUT"
            echo "to_ref=${SHA}"               >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: lint everything
            echo "from_ref=" >> "$GITHUB_OUTPUT"
            echo "to_ref="   >> "$GITHUB_OUTPUT"
          fi

      - name: Run pre-commit (changed files)
        id: pre_commit
        env:
          FROM_REF: ${{ steps.refs.outputs.from_ref }}
          TO_REF: ${{ steps.refs.outputs.to_ref }}
          # Collection-aware linting is handled by the run_ansible_lint job.
          SKIP: ansible-lint
        run: |
          set -o pipefail
          if [[ -n "$FROM_REF" ]]; then
            pixi run -e dev pre-commit run \
              --from-ref "$FROM_REF" \
              --to-ref   "$TO_REF"   \
              --show-diff-on-failure \
              --color always \
              2>&1 | tee /tmp/pre-commit-output.txt
          else
            pixi run -e dev pre-commit run \
              --all-files \
              --show-diff-on-failure \
              --color always \
              2>&1 | tee /tmp/pre-commit-output.txt
          fi

      - name: Write job summary
        if: always()
        env:
          PRE_COMMIT_OUTCOME: ${{ steps.pre_commit.outcome }}
          FROM_REF: ${{ steps.refs.outputs.from_ref }}
          TO_REF: ${{ steps.refs.outputs.to_ref }}
        run: |
          if [[ "$PRE_COMMIT_OUTCOME" == "success" ]]; then
            BADGE="All linting hooks passed"
          else
            BADGE="One or more linting hooks failed"
          fi

          if [[ -n "$FROM_REF" ]]; then
            SCOPE="\`${FROM_REF}\`..\`${TO_REF}\`"
          else
            SCOPE="all files (workflow_dispatch)"
          fi

          {
            echo "## Lint results"
            echo ""
            echo "$BADGE"
            echo ""
            echo "**Scope:** changed files — ${SCOPE}"
            echo ""
            echo "Hooks and pinned versions live in \`.pre-commit-config.yaml\` (\`rev:\`)"
            echo "and \`pixi.toml\` (\`[feature.dev.dependencies]\`)."
            echo ""
            if [[ -s /tmp/pre-commit-output.txt ]]; then
              echo "### Output"
              echo ""
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' /tmp/pre-commit-output.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  get_changed_files:
    name: Get changed yaml files
    runs-on: ubuntu-24.04
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
      all_changed_files: ${{ steps.changed-files.outputs.all_changed_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed files
        id: changed-files
        # Pin to commit; not an official github action
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad  # v47.0.5
        with:
          files: |
            **/*.{yml,yaml}
          # ansible-lint ignores exclude_paths for explicitly passed files
          files_ignore: |
            .github/**
            collections/ansible_collections/**
            roles/install_module/vars/**
            scripts/deploy_ioc.yml
            mkdocs.yml

  run_ansible_lint:
    name: Run ansible-lint (with galaxy collections)
    runs-on: ubuntu-24.04
    needs: [get_changed_files]
    if: needs.get_changed_files.outputs.any_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Pixi
        # SHA pin for supply-chain safety; comment shows the human-readable tag.
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.2
        with:
          pixi-version: v0.83.0
          environments: dev
          cache: false
          frozen: true

      - name: Cache ansible galaxy collections
        id: collections-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/collections/ansible_collections
          key: ansible-collections-${{ hashFiles('collections/requirements.yml') }}

      - name: Install ansible galaxy requirements
        if: steps.collections-cache.outputs.cache-hit != 'true'
        run: |
          pixi run -e dev ansible-galaxy collection install \
            -r collections/requirements.yml \
            -p collections \
            --timeout 120

      - name: Lint changed ansible files
        env:
          ANSIBLE_COLLECTIONS_PATH: "${{ github.workspace }}/collections"
          FILES_TO_LINT: "${{ needs.get_changed_files.outputs.all_changed_files }}"
        run: |
          set -euo pipefail
          read -r -a files <<< "$FILES_TO_LINT"
          pixi run -e dev ansible-lint \
            -c .ansible-lint \
            --offline \
            "${files[@]}"
